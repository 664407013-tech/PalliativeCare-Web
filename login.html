<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบคำนวณยา Palliative Care | Narathiwat Hospital</title>
    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts: Prompt & Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-body">

<div class="login-panel">

    <!-- ============ LEFT PANEL : NAVY→BLUE GRADIENT BRAND SIDE ============ -->
    <div class="login-left">
        <div class="login-left-content">
            <div class="login-emblem" aria-hidden="true">
                <img src="hospital-logo-icon.png?v=2" alt="Narathiwat Ratchanakarin Hospital" class="login-emblem-img">
            </div>

            <h1 class="login-hospital-name">Narathiwat Ratchanakarin Hospital</h1>
            <p class="login-hospital-sub">Palliative Care Management</p>
        </div>
    </div>

    <!-- ============ RIGHT PANEL : LOGIN CARD ============ -->
    <div class="login-right">
        <div class="login-card">

            <div class="login-card-header">
                <i class="bi bi-box-arrow-in-right"></i>
                <span>เข้าสู่ระบบ</span>
            </div>

            <div class="login-card-body">
                <h2 class="login-title">ยินดีต้อนรับกลับ</h2>
                <p class="login-subtitle">เข้าสู่ระบบเพื่อใช้งาน Palliative Care Management</p>

                <form id="loginForm" autocomplete="off" novalidate>
                    <div class="mb-3">
                        <label class="form-label login-label" for="username">
                            <i class="bi bi-person-fill"></i> ชื่อผู้ใช้งาน
                        </label>
                        <div class="login-input-group">
                            <i class="bi bi-person input-icon"></i>
                            <input type="text" id="username" name="username" class="form-control custom-input login-input"
                                   placeholder="กรอกชื่อผู้ใช้งาน" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label login-label" for="password">
                            <i class="bi bi-lock-fill"></i> รหัสผ่าน
                        </label>
                        <div class="login-input-group">
                            <i class="bi bi-lock input-icon"></i>
                            <input type="password" id="password" name="password" class="form-control custom-input login-input"
                                   placeholder="กรอกรหัสผ่าน" required>
                            <button type="button" class="login-eye-btn" id="togglePassword" aria-label="แสดง/ซ่อนรหัสผ่าน" tabindex="-1">
                                <i class="bi bi-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div id="loginAlert" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

                    <button type="submit" class="btn login-btn w-100 d-flex align-items-center justify-content-center gap-2" id="loginBtn">
                        <span id="loginBtnText">เข้าสู่ระบบ</span>
                        <i class="bi bi-arrow-right" id="loginBtnIcon"></i>
                        <span class="spinner-border spinner-border-sm d-none" id="loginSpinner" role="status" aria-hidden="true"></span>
                    </button>
                </form>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=1"></script>
<script src="treatment-calc.js?v=1"></script>
<script src="supabase-api.js?v=1"></script>
<script src="login.js?v=2"></script>
</body>
</html>
